<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Register II</title>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" type="text/css" href="regstyle.css">
</head>
<body>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<h1 style="color:red; ">Sign Your Name In <strong>BLOOD</strong></h1>

<form>
  <div class="row mb-3">
    <label for="inputEmail3" class="col-sm-2 col-form-label">First Name</label>
    <div class="col-sm-5">
      <input type="name" class="form-control" id="first">
    </div>
  </div>

  <div class="row mb-3">
    <label for="inputPassword3" class="col-sm-2 col-form-label">Last Name</label>
    <div class="col-sm-5">
      <input type="name" class="form-control" id="last">
    </div>
  </div>

  <div class="row mb-3">
    <label for="inputEmail3" class="col-sm-2 col-form-label">Email</label>
    <div class="col-sm-5">
      <input type="email" class="form-control" id="email">
    </div>
  </div>

  <div class="row mb-3">
    <label for="inputPassword3" class="col-sm-2 col-form-label">Password</label>
    <div class="col-sm-5">
      <input type="password" class="form-control" id="password">
    </div>
  </div>

  <fieldset class="row mb-3">
    <legend class="col-form-label col-sm-2 pt-0">Gender</legend>
    <div class="col-sm-7">

      <div class="form-check">
        <input class="form-check-input" type="radio" name="genderMale" id="Male" value="male">
        <label class="form-check-label" for="Male">
          Male
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="genderFemale" id="Female" value="female">
        <label class="form-check-label" for="Female">
          Female
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="genderNot" id="preferNot" value="prefernot">
        <label class="form-check-label" for="preferNot">
          Prefer not to specify
        </label>
      </div>

      <div class="form-check disabled">
        <input class="form-check-input" type="radio" name="genderNA" id="NA" value="N/A" disabled>
        <label class="form-check-label" for="NA">
          N/A
        </label>
      </div>
    </div>

    <div class="row mb-3">
    	<legend class="col-form-label col-sm-2 pt-0">Pets</legend>
      <div class="col-sm-10 offset-sm-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="petYes">
          <label class="form-check-label" for="petYes">Yes</label>
        </div>
      </div>

      <div class="col-sm-10 offset-sm-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="petNo">
          <label class="form-check-label" for="petNo">No</label>
        </div>
      </div>
    </div>

    <div class="row mb-3">
    	<legend class="col-form-label col-sm-2 pt-0">Are you a smoker?</legend>
      <div class="col-sm-10 offset-sm-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="smokeYes">
          <label class="form-check-label" for="smokeYes">Yes</label>
        </div>
      </div>

      <div class="col-sm-10 offset-sm-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="smokeNo">
          <label class="form-check-label" for="smokeNo">No</label>
        </div>
      </div>
    </div>

</fieldset>

  <button type="submit" class="btn btn-primary">Register</button>
</form>
<br>

<h2> Insert Label Here </h2>

<br>
<form>
	<div class="row mb-3">
	    <label for="inputEmail3" class="col-sm-2 col-form-label">ID Number</label>
	    <div class="col-sm-5">
	      <input type="name" class="form-control" id="IDnum">
	    </div>
	  </div>

	  <div class="row mb-3">
	    <label for="inputPassword3" class="col-sm-2 col-form-label">SSN</label>
	    <div class="col-sm-5">
	      <input type="name" class="form-control" id="SSN">
	    </div>
	  </div>

	  <div class="row mb-3">
	    <label for="inputEmail3" class="col-sm-2 col-form-label">Address</label>
	    <div class="col-sm-5">
	      <input type="name" class="form-control" id="Address">
	    </div>
	 </div>

  <label for="accountType" class="col-sm-2 col-form-label" id="accountType">Account Type</label>
	<div class="row">
	  <div class="col">
	  		<label class="form-check-label" for="newMember">New Member</label>
	  		<input class="form-check-input" type="checkbox" id="newMember">
	    	<!-- <input type="text" class="form-control" placeholder="New Member" aria-label="New Member"> -->
	  	</div>

	  	<div class="col">
	    	<label class="form-check-label" for="policy">Policy Holder</label>
	  		<input class="form-check-input" type="checkbox" id="policy">
	  	</div>

	  	<div class="col">
	    	<label class="form-check-label" for="goldCard">Gold Card Holder</label>
	  		<input class="form-check-input" type="checkbox" id="goldCard">
	  </div>
	</div>
	<br>
	</form>

	<form>
	<div class="row mb-2">
	  	<legend class="col-form-label">Were you referred by any bargaining souls?</legend>
	    <div class="col-sm-10">
	      <div class="form-check">
	        <input class="form-check-input" type="checkbox" id="soulYes">
	        <label class="form-check-label" for="soulYes">Yes</label>
	      </div>
	    </div>
	    <div class="col-sm-10">
	      <div class="form-check">
	        <input class="form-check-input" type="checkbox" id="soulNo">
	        <label class="form-check-label" for="soulNo">No</label>
	      </div>
	    </div>
	  </div>

	  <button type="submit" class="btn btn-primary">Submit</button>
	</form>
<br>

<div class="Return">
	<a href="index(bs).html" style="color: whitesmoke;">Return to Page</a>
</div>

</body>
